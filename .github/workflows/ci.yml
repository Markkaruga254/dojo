name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install -e ".[dev]"

      - name: Lint completed Python modules
        run: python -m ruff check scripts tests dsa/solutions

      - name: Check Markdown links
        run: python scripts/check_markdown_links.py

      - name: Run core tests
        run: python -m pytest -q

      - name: Run NSE platform tests
        run: python -m pytest -q nse_platform/tests
        env:
          PYTHONPATH: nse_platform/src
